server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Extend nginx's default MIME map instead of replacing it — a bare
    # `types {}` block here would drop every other extension (including
    # text/html) to application/octet-stream.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Single-page static site: no server-side routes exist beyond the assets
    # above, so anything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Extend nginx's default MIME map instead of replacing it — a bare
    # `types {}` block here would drop every other extension (including
    # text/html) to application/octet-stream.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # The page holds a hot signing key: never let it be framed. `add_header` in
    # a location *replaces* the inherited set rather than extending it, so every
    # location below that sets a header of its own restates these four.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # TLS terminates at Cloudflare/Coolify in front of this container, so HSTS
    # is set there. Uncomment only when this server itself serves HTTPS:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Single-page static site: no server-side routes exist beyond the assets
    # above, so anything else falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
